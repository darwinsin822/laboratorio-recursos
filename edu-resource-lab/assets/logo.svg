<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="grad-bg" x1="28" y1="28" x2="228" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="grad-flask" x1="80" y1="70" x2="176" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0E7FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="grad-liquid" x1="90" y1="130" x2="166" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="10" y="10" width="236" height="236" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338CA" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas (with 10% outer padding) -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="url(#grad-bg)" filter="url(#glow)" />

  <!-- Educational Lab Flask & Open Book Graphic -->
  <!-- Laboratory Flask Outline -->
