  <!-- Liquid in Flask -->
  <path d="M94 148L84 166C82 170 85 174 89 174H167C171 174 174 170 172 166L162 148C154 152 142 146 128 149C114 152 102 144 94 148Z" fill="url(#grad-liquid)" />
  
  <!-- Flask Lip -->
  <rect x="110" y="64" width="36" height="8" rx="4" fill="#FFFFFF" />

  <!-- Bubbles & Sparkles -->
  <circle cx="118" cy="136" r="4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="138" cy="122" r="5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="130" cy="144" r="3" fill="#FFFFFF" opacity="0.8" />

  <!-- Stars / Innovation Sparkles -->
  <path d="M178 68L181 77L190 80L181 83L178 92L175 83L166 80L175 77Z" fill="#FACC15" />
  <path d="M76 100L78 106L84 108L78 110L76 116L74 110L68 108L74 106Z" fill="#38BDF8" />

  <!-- Open Book Base Foundation -->
