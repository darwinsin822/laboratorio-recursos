<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Top Banner -->
  <rect x="60" y="40" width="1080" height="110" rx="16" fill="url(#accentGrad)" filter="url(#shadow)" />
  <text x="90" y="90" font-family="system-ui, sans-serif" font-size="32" font-weight="bold" fill="#ffffff">INFOGRAFÍA CONCEPTUAL DIDÁCTICA</text>
  <text x="90" y="125" font-family="system-ui, sans-serif" font-size="18" fill="#e0f2fe">UESMA 2026-2027 • Material Presencial de Alta Fidelidad</text>

  <!-- 3 Conceptual Pillars -->
  <!-- Pillar 1 -->
  <rect x="60" y="180" width="340" height="540" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <circle cx="110" cy="230" r="28" fill="#38bdf8" />
  <text x="103" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">1</text>
  <text x="155" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Fase Inicial</text>
  <text x="90" y="290" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Activación Cognitiva</text>
  <rect x="90" y="320" width="280" height="3" fill="#0284c7" />
  <text x="90" y="360" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Conflicto cognitivo guiado</text>
  <text x="90" y="395" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Lluvia de conceptos clave</text>
  <text x="90" y="430" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Motivación y propósito</text>

  <!-- Pillar 2 -->
  <rect x="430" y="180" width="340" height="540" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="3" filter="url(#shadow)" />
  <circle cx="480" cy="230" r="28" fill="#0284c7" />
  <text x="473" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">2</text>
  <text x="525" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Desarrollo</text>
  <text x="460" y="290" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Construcción Práctica</text>
  <rect x="460" y="320" width="280" height="3" fill="#38bdf8" />
  <text x="460" y="360" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Modelado y andamiaje</text>
  <text x="460" y="395" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Interacción con simuladores</text>
  <text x="460" y="430" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Taller práctico cooperativo</text>

  <!-- Pillar 3 -->
  <rect x="800" y="180" width="340" height="540" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <circle cx="850" cy="230" r="28" fill="#22c55e" />
  <text x="843" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#0f172a">3</text>
  <text x="895" y="238" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Cierre</text>
  <text x="830" y="290" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Metacognición y Logro</text>
  <rect x="830" y="320" width="280" height="3" fill="#22c55e" />
  <text x="830" y="360" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Ticket de salida evaluativo</text>
  <text x="830" y="395" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Rúbrica formativa y feedback</text>
  <text x="830" y="430" font-family="system-ui, sans-serif" font-size="15" fill="#cbd5e1">• Consolidación de aprendizajes</text>

  <!-- Footer -->
  <text x="600" y="760" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Laboratorio de Recursos Educativos UESMA • Exportación Vectorial Directa</text>
</svg>
